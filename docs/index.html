<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- Non-standard hints that nudge some Android browsers toward landscape. -->
  <meta name="screen-orientation" content="landscape">
  <meta name="x5-orientation" content="landscape">
  <!-- Enables fullscreen mode when added to iOS/Android home screen,
       which is a prerequisite for screen.orientation.lock() on some platforms. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Forty Twierdzy Toruń</title>
  <link rel="icon" href="data:,">

  <!-- Reveal.js core -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@6.0.1/dist/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@6.0.1/dist/reveal.css">

  <!-- MapLibre GL JS for map. integrity: sha384 of this exact pinned file,
       cross-checked against the same file extracted from the npm registry's
       own tarball; recalculate if the version below ever changes. -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.1.0/dist/maplibre-gl.css" integrity="sha384-Gy41S0IRKagep76pE/h7l/Ptg2JLgQzXwshjlqZOghGGDeDKuJyxmCndqvWZ/vLm" crossorigin="anonymous"/>

  <!-- EMBEDDED CSS -->
  <style>
    /* Every color used anywhere on this page, named after the color itself
       (not what it is used for), defined once here as rgba() rather than
       repeated as literal values throughout the stylesheet. rgba(), not
       hex or plain rgb(), so every entry, opaque or transparent, uses the
       one format that carries an explicit alpha channel. */
    :root {
      --khaki: rgba(150, 136, 95, 1);
      --khaki-dark: rgba(122, 109, 80, 1);
      --khaki-light: rgba(184, 168, 123, 1);
      --khaki-lightest: rgba(192, 182, 155, 1);
      --white: rgba(255, 255, 255, 1);
      --black: rgba(0, 0, 0, 1);
      --orange: rgba(245, 165, 36, 1);
      --brown: rgba(30, 26, 18, 1);
      --brick: rgba(160, 82, 55, 1);
      --brick-dark: rgba(110, 55, 38, 1);
      --mortar: rgba(196, 189, 178, 1);
      /* Zwiedzanie ("visitable") status colors, both checked (via the WCAG 2.2
         relative-luminance formula, not by eye) for the 4.5:1 contrast its own
         AA normal-text minimum requires against the page's own dark
         background (--brown): --green measures 7.33:1, --red measures 4.97:1. */
      --green: rgba(102, 187, 106, 1);
      --red: rgba(239, 83, 80, 1);
      /* Opacity tints of the solid colors above, or of a color used nowhere
         else at full opacity (--green-dark). Named by their own base color
         plus the exact opacity percentage, so a reader can tell two
         tints' own relative transparency apart from the name alone. */
      --orange-60: rgba(245, 165, 36, 0.6);
      --black-20: rgba(0, 0, 0, 0.2);
      --black-30: rgba(0, 0, 0, 0.3);
      --black-40: rgba(0, 0, 0, 0.4);
      --black-55: rgba(0, 0, 0, 0.55);
      --black-60: rgba(0, 0, 0, 0.6);
      --white-85: rgba(255, 255, 255, 0.85);
      --green-dark-40: rgba(45, 80, 22, 0.4);
      --green-dark-85: rgba(45, 80, 22, 0.85);
    }

    html, body {
      overscroll-behavior: none;
    }

    html {
      height: 100dvh;
    }

    /* Fix the body to the viewport so the document itself can never
       scroll. A page that cannot scroll gives mobile browsers no reason to
       collapse or expand the URL bar on finger movements, which keeps the
       viewport size stable. The rule is inert on desktop because the content
       already fits the viewport, so the same code serves every platform. */
    body {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    * {
      box-sizing: border-box;
    }

    /* Dark warm-brown background applied at every layer Reveal.js uses,
       because backgroundColor in Reveal.initialize only sets an inline
       style on .reveal-viewport after JS runs, which reveal.css may
       temporarily override, and .slide-background elements are separate. */
    body,
    .reveal-viewport,
    .reveal .slide-background {
      background-color: var(--brown);
    }

    .reveal {
      font-family: "Source Sans Pro", Helvetica, sans-serif;
      font-size: 32px;
      color: var(--white);
      /* Shared box for the return button, fort title, and nav arrows: same
         top/height, each centers its own content via display:flex, so all
         three align without a hand-computed offset per element. */
      --fort-header-top: 20px;
      --fort-header-height: 60px;
      /* navigate-left's/navigate-right's own right offsets and rendered
         size (3.6em of .controls's font-size below); .fort-slide h3's own
         right offset is calc()'d from --fort-arrow-outer-offset and
         --fort-arrow-size, so it stays clear of the arrows if either
         changes, instead of a separately chosen constant. */
      --fort-arrow-inner-offset: 20px;
      /* 64 canvas px * 0.375 (the scale at 480x280, the project's own
         shortest supported real device) = 24px real, the WCAG 2.2 SC
         2.5.8 minimum touch target size. */
      --fort-arrow-size: 64px;
      /* navigate-left's own right offset: inner offset plus the arrow's
         own size, so the two arrows sit edge to edge at any size rather
         than a separately fitted number that could let them overlap. */
      --fort-arrow-outer-offset: calc(var(--fort-arrow-inner-offset) + var(--fort-arrow-size));
    }

    /* h2 (map slide's own title) and h3 (each fort slide's own title): the
       map slide's title is this page's own highest-level visible heading,
       so it stays one level above a fort slide's title rather than the two
       sharing one level, per WCAG 2.2's own heading-hierarchy guidance. */
    .reveal h2, .reveal h3 {
      font-family: "Source Sans Pro", Helvetica, sans-serif;
      text-transform: none;
      color: var(--orange);
      font-weight: 600;
      line-height: 1.2;
    }

    .reveal h2 { font-size: 48pt; }
    /* Smaller than the map slide's own h2, to accommodate longer fort
       titles on one line in the row shared with the return button and nav
       arrows; sized against the longest name in fortificationData, not
       just the currently visible forts. */
    .reveal h3 { font-size: 26pt; }
    .reveal p, .reveal li {
      font-size: 18pt;
      line-height: 1.5;
    }

    .reveal a {
      color: var(--khaki);
      text-decoration: underline;
    }

    .reveal a:hover {
      color: var(--khaki-dark);
    }

    /* Reveal.js's default navigation arrows compute to white, which is nearly
       invisible against both the pale map tiles and, at wide viewports, the
       dark brown letterbox margin around the scaled slide canvas (confirmed
       via computed-style checks with the project's puppeteer container).
       Recolored to the same accent orange used for the headings; the back
       (navigate-left) arrow is a fainter version of that color so its
       direction reads as secondary to the forward (navigate-right) arrow.
       Reveal.js detects the dark page background and adds a
       has-dark-background class to .reveal, which carries its own
       higher-specificity white .controls color rule (three classes vs. two);
       the selector below is repeated with that class so ours wins instead. */
    .reveal .controls,
    .reveal.has-dark-background .controls {
      color: var(--orange);
    }

    /* font-size (the arrows' own 3.6em basis) is derived from
       --fort-arrow-size rather than stated independently, so the two
       can't drift apart. */
    .reveal .controls {
      font-size: calc(var(--fort-arrow-size) / 3.6);
    }

    .reveal .controls .navigate-left {
      color: var(--orange-60);
    }

    /* Moved from reveal.css's own default bottom-right cluster to a fixed
       bar at the top of the viewport: at the bottom, the arrows sometimes
       overlapped a fort slide's own description text. .controls is moved
       into .slides at runtime (see moveControlsIntoSlides) specifically so
       these plain px values get the same scale transform as the fort
       title/return button automatically, instead of staying real screen
       pixels; a CSS transform on an ancestor becomes the containing block
       for a fixed-position descendant, which is what makes that work.
       navigate-up/navigate-down are hidden rather than repositioned: this
       presentation has no vertical slide stacks, so both are always inert. */
    .reveal .controls .navigate-up,
    .reveal .controls .navigate-down {
      display: none;
    }

    /* Repeated with :not(.has-vertical-slides), matching reveal.css's own
       .reveal:not(.has-vertical-slides) .controls .navigate-left/right
       rule's specificity (this presentation has no vertical slides, so
       that rule always applies and otherwise wins the top/bottom fight
       below): without this, its own bottom:1.4em stayed active alongside
       this rule's top:20px, and a position:fixed element with both top and
       bottom set stretches to fill the gap between them instead of sizing
       to its own content, confirmed with the project's puppeteer container
       (a ~1000px tall invisible hit-target instead of a 36px arrow). */
    .reveal .controls .navigate-left,
    .reveal .controls .navigate-right,
    .reveal:not(.has-vertical-slides) .controls .navigate-left,
    .reveal:not(.has-vertical-slides) .controls .navigate-right {
      position: fixed;
      /* Centered on the same --fort-header row as the button/title (see
         .reveal above): the arrow can't take an explicit height itself
         without distorting its own 3.6em-square glyph, so this subtracts
         half of that (1.8em, in the arrow's own font-size) instead, which
         stays correct if .controls's font-size (arrow size) ever changes. */
      top: calc(var(--fort-header-top) + var(--fort-header-height) / 2 - 1.8em);
      bottom: auto;
      transform: none;
    }

    .reveal .controls .navigate-left,
    .reveal:not(.has-vertical-slides) .controls .navigate-left {
      left: auto;
      right: var(--fort-arrow-outer-offset);
    }

    .reveal .controls .navigate-right,
    .reveal:not(.has-vertical-slides) .controls .navigate-right {
      right: var(--fort-arrow-inner-offset);
    }

    .reveal .slides section {
      width: 100%;
      height: 100%;
      padding: 60px;
    }

    /* reveal.css hides every slide by default (.reveal .slides>section{display:none},
       specificity 0,2,1) and only shows the current one via
       .reveal .slides>section.present{display:block} (specificity 0,3,1, the extra
       .present class). Matching that .present scope and specificity here, instead of
       setting display:flex unconditionally above, is required: an unconditional
       display:flex on every section has the same specificity (0,2,1) as reveal.css's
       own hiding rule but sits later in the cascade, so it used to win the tie and show
       every slide, stacked in normal document flow, for the ~0.3-0.5s between the
       browser parsing this markup and Reveal.initialize() finishing and assigning the
       present/past/future classes. */
    .reveal .slides section.present {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Map slide styles */
    #map-slide {
      padding: 0 !important;
      position: relative;
      overflow: hidden;
    }

    #map-slide h2 {
      position: absolute;
      top: 20px;
      left: 40px;
      margin: 0;
      z-index: 10;
      font-size: 32pt;
    }

    #map {
      position: absolute;
      top: 100px;
      left: 0;
      width: 100%;
      height: calc(100% - 100px - 30px);
    }

    /* Thin strip at the bottom of the map slide that guarantees the
       MapLibre attribution is never clipped by the slide boundary on
       screens with varying aspect ratios. */
    .map-footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 30px;
      background-color: var(--brown);
    }

    /* Fortification description slides */
    .fort-slide {
      /* Reveal.js gives sections position:absolute but leaves top:auto, so the browser
         uses each section's hypothetical static position. Because #map-slide has
         position:relative it occupies 720 px in the normal flow, pushing every fort
         slide's static position to y=720 — one full slide below the viewport. Setting
         top:0 and left:0 explicitly overrides top:auto and keeps fort slides at the
         origin that Reveal.js's container transform expects. */
      top: 0;
      left: 0;
      /* Clears the button/title/arrows row below (top:20px + height:60px,
         see --fort-header-* on .reveal) plus a 25px gap, now that the
         title moved into that row instead of stacking below it (see
         .fort-slide h3 below), leaving the rest of the fixed-height canvas
         to the description text. */
      padding-top: 105px !important;
      /* Override the inherited justify-content:center so the heading is always visible
         at the top of the slide rather than potentially scrolled out of the clipped viewport. */
      justify-content: flex-start !important;
    }

    /* Same row as the return button and nav arrows rather than stacked
       below them, freeing that space for the description below. right is
       calc()'d from the same --fort-arrow-* properties that position
       navigate-left, plus a 20px gap, so it stays clear of the arrows if
       either one changes rather than a separately chosen constant. width
       is relative so it clears the button on every viewport without
       pinning an exact left edge to the button's own measured width. */
    .fort-slide h3 {
      position: absolute;
      top: var(--fort-header-top);
      height: var(--fort-header-height);
      right: calc(var(--fort-arrow-outer-offset) + var(--fort-arrow-size) + 20px);
      width: 60%;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .return-button {
      position: absolute;
      top: var(--fort-header-top);
      height: var(--fort-header-height);
      display: flex;
      align-items: center;
      left: 40px;
      padding: 0 28px;
      background-color: var(--khaki);
      color: var(--white);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 20pt;
      font-weight: 600;
    }

    .return-button:hover {
      background-color: var(--khaki-dark);
    }

    /* display:grid with fr track units, not flex with percentage flex-basis:
       a flex row's own percentage flex-basis, and a grid's own percentage
       track size, are both resolved against the container's full
       content-box width with no automatic adjustment for the gap between
       items, so a plain 40%/60% split already sums to the full container
       width and the 40px gap then pushes .fort-text 40px past
       .fort-content's own right edge (confirmed both ways with the
       project's puppeteer container: getBoundingClientRect() showed
       exactly that same 40px, scaled by Reveal's own transform, at every
       tested viewport, whether flex-basis or a grid percentage track was
       used). fr units are different: by definition they distribute
       whatever space remains after every gap and every fixed-size track is
       already subtracted, so 2fr/3fr (the same 40/60 ratio) sums, together
       with the 40px gap between them, to exactly 100% with no manual pixel
       offset, confirmed the same way (zero overflow at every tested
       viewport). */
    .fort-content {
      display: grid;
      grid-template-columns: 2fr 3fr;
      gap: 40px;
      align-items: start;
    }

    .fort-image img {
      /* display: block, not the <img> default of inline: an inline replaced
         element reserves descender space below itself within its own line
         box, which made .fort-photo's own height (and so .fort-video-badge's
         own bottom: 8px, anchored to that height) run a few pixels taller
         than the photo's own true visible bottom edge, making the badge's
         bottom inset visibly smaller than its left inset despite both being
         coded as the same 8px. */
      display: block;
      width: 100%;
      /* Fixed, not max-height: max-height left each photo at its own
         natural, aspect-ratio-dependent size, causing the taller-aspect
         forts to render noticeably taller than others. 320px is verified
         to leave room for the longest Kontakt text across all 15 forts. */
      height: 320px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 2px 8px var(--black-20);
    }

    /* Selector is .reveal .fort-description, not just .fort-description,
       so this rule outranks the earlier .reveal p, .reveal li rule instead
       of losing to it (see .reveal .fort-meta below for the same fix). */
    .reveal .fort-description {
      font-size: 20pt;
      line-height: 1.6;
      /* No top margin: the <h3> that used to sit in-flow above this
         paragraph is now absolutely positioned into the header row (see
         .fort-slide h3), so this is .fort-text's own first in-flow child
         and a top margin would only misalign it against .fort-image's own
         flush top edge, not create space below a heading that is no
         longer there. */
      margin: 0 0 20px 0;
      /* reveal.css's own .reveal default is text-align:center; left-aligned
         here so sentences break naturally at the browser's own word-wrap
         points instead of each line being centered individually. */
      text-align: left;
    }

    /* Visitable/address/contact lines generated from fortificationData below
       the image (see appendFortSlide()'s own comment for why that column, not
       the text column), one per known field (a fort with no contact info
       skips that line rather than showing an empty one). Sized and colored
       like .image-credit below, since these are secondary metadata rather
       than the slide's own descriptive text.
       Selector is .reveal .fort-meta, not just .fort-meta, to outrank
       .reveal p, .reveal li above (0,1,1 specificity: one class plus one
       element) the same way this file's own reveal.js integration notes
       already document doing elsewhere for a similar specificity fight
       (see "Preventing every slide from flashing visible" in README.md): a
       plain .fort-meta (0,1,0) lost to that rule regardless of its own
       font-size value, silently rendering every meta line at .reveal p's
       flat 18pt no matter what was declared here, confirmed by reading
       getComputedStyle() directly rather than assuming a source-order fix
       would be enough. 20pt, a bit larger than that true previous 18pt,
       applies uniformly to Adres/Zwiedzanie/Kontakt: an earlier version of
       this rule sized Zwiedzanie larger than the other two via a separate
       .fort-visitable rule, since removed so all three meta lines read as
       one consistent size. */
    .reveal .fort-meta {
      font-size: 20pt;
      color: var(--khaki-light);
      margin: 4px 0;
      /* reveal.css's own .reveal default is text-align:center; left-aligned
         here instead so a long value (e.g. a Kontakt line with both a phone
         number and an email address) has the image column's own full width
         to grow into on one side, rather than centering and eating into the
         margin on both sides equally. */
      text-align: left;
    }

    .fort-meta strong {
      color: var(--white);
    }

    .fort-visitable-yes {
      color: var(--green);
      font-weight: 600;
    }

    .fort-visitable-no {
      color: var(--red);
      font-weight: 600;
    }

    /* Overlaid on the fort photo's own bottom-left corner, diagonal from
       .image-credit's own top-right Wikimedia badge below, rather than
       placed beside the Zwiedzanie/Adres/Kontakt lines: an earlier version
       did that and the thumbnail ended up looking low and unbalanced,
       since those lines vary from 2 to 4 lines fort to fort (Kontakt is 0,
       1, or 2 lines depending on the fort) while the thumbnail's own height
       stayed fixed, so nothing had a stable line to align against. Overlaid
       on the photo instead, it never has to align with metadata text at
       all, regardless of how long Kontakt is for a given fort.
       width: 30% is set here, not on .fort-video-thumb below, because a
       percentage width only resolves against a definite containing-block
       width: this element (position: absolute, with left set but not
       right) is the one whose containing block is .fort-image's own
       definite, resolved width; putting the percentage on
       .fort-video-thumb instead (an earlier version did, sized against this
       flex column's own then-undefined auto width) made browsers fall back
       to a shrink-to-fit width nearly as wide as .fort-image itself. 30%,
       not the first version's 40%: cropping .fort-video-thumb below to 1:1
       (see that class's own comment) made the same 40% width noticeably
       larger overall (taller, and more zoomed into the presenter's own
       portrait) than the previous 4:3 version, so the width is reduced by a
       further quarter (40% * 0.75 = 30%) on top of that crop.
       bottom: 8px; left: 8px, the same inset .image-credit above uses on
       its own opposite corner, for a floating "picture-in-picture" look
       rather than a flush-cornered one, which read as stuck to the photo's
       own edge rather than deliberately placed. */
    .fort-video-badge {
      position: absolute;
      bottom: 8px;
      left: 8px;
      width: 30%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    /* --orange, the same color .reveal h2/h3 and the map slide's own
       heading already use. The previous var(--khaki-dark) was too close to
       the surrounding photo's own dark tones to read at all.
       Selector is .reveal .fort-video-label, not just .fort-video-label,
       so this rule outranks the earlier .reveal p, .reveal li rule instead
       of losing to it (see .reveal .fort-meta below for the same fix). */
    .reveal .fort-video-label {
      margin: 0;
      font-size: 14pt;
      font-weight: 700;
      color: var(--orange);
    }

    /* A plain YouTube thumbnail image, not the iframe embed this project used
       before: the iframe's own initial "cued" state always draws a large
       play-button icon centered over the whole frame, which on this
       project's own fort videos (a presenter shown mid-frame, not B-roll)
       covered exactly the face the thumbnail was meant to show. The
       thumbnail image itself carries no such overlay, so a small corner
       .play-badge below is added instead, deliberately not centered.
       aspect-ratio: 1/1, not the source hqdefault.jpg's own 4:3 (480x360):
       sampling the actual pixels of this project's own four thumbnails
       (a same-origin canvas read of each downloaded image, avoiding the
       cross-origin canvas restriction a live img src triggers) found an
       identical 59px solid-black bar on each side of all four, baked into
       the channel's own thumbnail template rather than added by this
       project's own CSS. object-fit: cover into a 1:1 box crops the 480-wide
       source down to its own central 360px, which lands almost exactly on
       that measured 59px boundary (480 - 59*2 = 362, 2px from 360), so the
       bars disappear without cutting into the presenter's own portrait. A
       white border separates the thumbnail from whatever part of the fort's
       own photo is directly behind it, reinforcing the floating
       "picture-in-picture" look .fort-video-badge's own inset positioning
       is going for. width: 100% (of .fort-video-badge, see that class's own
       comment for why the percentage lives there instead). */
    .fort-video-thumb {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid var(--white-85);
      box-shadow: 0 2px 8px var(--black-40);
    }

    .fort-video-thumb:hover {
      border-color: var(--orange);
    }

    .fort-video-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Bottom-right corner only, unlike the iframe embed's own centered play
       button (see .fort-video-thumb above), so it signals "this is a video"
       without sitting over the presenter's face. Styled after .image-credit
       below: same dark semi-transparent badge language already used for the
       Wikimedia credit on the main photo. */
    .play-badge {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background-color: var(--black-60);
      color: var(--white);
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Portrait overlay — shown via @media below; hidden by default. */
    #portrait-warning {
      display: none;
      position: fixed;
      inset: 0;
      background-color: var(--brown);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      text-align: center;
      padding: 40px;
      font-family: "Source Sans Pro", Helvetica, sans-serif;
    }

    /* color set explicitly, not inherited from .reveal h2: #portrait-warning
       is a sibling of .reveal (see .glossary-frame's own comment above for
       the same reasoning), so that descendant selector never reaches here. */
    /* 25pt: measured to wrap "Forty Twierdzy Toruń" onto two lines at
       300px, this project's own narrowest supported portrait width (17pt
       is the largest size that keeps it on one line there), kept anyway
       for visual size at the cost of wrapping on the narrowest screens. */
    #portrait-warning h2 {
      margin: 0;
      font-size: 30pt;
      line-height: 1.2;
      color: var(--orange);
    }

    /* Sized off vh, not vw: this overlay is a sibling of .reveal (see
       .glossary-frame's own comment above for the same reasoning), and
       aspect-ratio keeps it at the source SVG's own 1280:987 proportions
       regardless of the sizing unit. */
    #portrait-warning .rotate-icon {
      width: 20vh;
      max-width: 70vw;
      aspect-ratio: 1280 / 987;
      /* The wiggle animation below swings the icon's own bounding box
         wider than its resting size; margin keeps that swing clear of the
         title above and the "Obróć poziomo" text below at every point in
         the animation, not just at rest. */
      margin-top: 5vh;
      margin-bottom: 5vh;
      /* Small back-and-forth wiggle, not a full 90° flip: mimes the
         rotation gesture without disorienting a large, detailed icon. */
      animation: hint-rotate 2.25s ease-in-out infinite;
    }

    @keyframes hint-rotate {
      0%, 100% { transform: rotate(0deg); }
      50%       { transform: rotate(15deg); }
    }

    #portrait-warning p {
      color: var(--khaki-lightest);
      font-size: 20pt;
      margin: 0;
    }

    #portrait-warning p.subtitle {
      color: var(--khaki-light);
      font-size: 14pt;
    }

    /* On small portrait screens, show the overlay and hide the presentation. */
    @media screen and (orientation: portrait) {
      #portrait-warning { display: flex; }
      .reveal          { display: none; }
    }

    /* The reveal.js .reveal a rule sets color and text-decoration on all anchors,
       which bleeds into the MapLibre attribution links (underlined, primary-color
       text). Reset those properties explicitly for the attribution control. Also
       sets color on the container itself, not just its anchors: plain text in the
       attribution string that sits outside any <a> (e.g. "Data from" before the
       OpenStreetMap link) otherwise keeps inheriting the page's own white text
       color, invisible against the attribution control's own light background. */
    .maplibregl-ctrl-attrib {
      color: var(--black);
    }

    .maplibregl-ctrl-attrib a {
      color: var(--black);
      text-decoration: none;
    }

    /* Compensate the zoom control for Reveal.js's CSS transform scale, so
       it keeps its intended physical size (and WCAG tap-target size) on
       screen regardless of viewport. */
    .maplibregl-ctrl-group {
      zoom: var(--map-counter-zoom, 1);
    }

    /* font-size is a plain local (canvas-space) value, not compensated by
       --map-counter-zoom like the zoom control above: word-wrap is decided
       in that same local space, where #map is always 1280px wide, so a
       flat local size keeps the same wrap outcome and the same proportion
       of the map's own width at every real viewport, confirmed with the
       project's puppeteer container across the full viewport sweep
       (~68% of the map's own width, no wrap, at 460px through 1920px).
       height/line-height: auto/normal, overriding MapLibre's own fixed
       20px/20px default, which did not grow if the text ever did wrap,
       spilling the second line past #map-slide's own overflow:hidden. */
    .maplibregl-ctrl-attrib {
      font-size: 20px;
      height: auto;
      line-height: normal;
      /* MapLibre's own default is text-align: right, tuned for its default
         bottom-right position; this control is moved to bottom-left. */
      text-align: left;
    }

    /* Semi-transparent square label shown as the map marker icon. */
    .fort-letter-box {
      width: 33px;
      height: 33px;
      background: var(--green-dark-40);
      border: 1px solid var(--black-30);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 12px;
      color: var(--white);
      cursor: pointer;
    }

    .fort-letter-box:hover {
      background: var(--green-dark-85);
    }

    /* Overlaid on the image's own top-right corner, rather than left below
       it as before: that freed the vertical space .fort-meta below the
       image now uses (see appendFortSlide()'s own comment on why .fort-meta
       lives there). A background box is required at this corner placement,
       unlike the previous below-image placement, since a light patch of the
       photo underneath would otherwise make light text unreadable at
       whatever point in the image it happens to land.
       Selector is .reveal .image-credit, not just .image-credit, so this
       rule outranks the earlier .reveal p, .reveal li rule instead of
       losing to it (see .reveal .fort-meta below for the same fix). */
    .reveal .image-credit {
      position: absolute;
      top: 8px;
      right: 8px;
      margin: 0;
      padding: 2px 8px;
      background-color: var(--black-55);
      border-radius: 4px;
      font-size: 16pt;
      color: var(--white);
    }

    .image-credit a {
      color: var(--white);
    }

    /* Wraps only the <img> (plus .image-credit and .fort-video-badge, both
       position: absolute against this element), separately from the
       Adres/Zwiedzanie/Kontakt lines that follow as .fort-image's own next
       sibling: position: relative here means both those absolutely
       positioned corner badges anchor to the photo's own edges specifically.
       An earlier version set position: relative on .fort-image itself,
       which wraps the photo and the meta lines together; that placed
       .fort-video-badge's own bottom: 8px against the bottom of that whole
       taller box instead, so the badge overlapped the Adres line below the
       photo rather than sitting inside the photo's own corner.
       .image-credit's own top-right position happened to still look correct
       under that same bug, purely because the <img> is .fort-image's first
       child, so their top edges coincide regardless of what follows below;
       nothing about bottom: 8px has that same coincidence. */
    .fort-photo {
      position: relative;
    }

    /* The fort title (linking to nameUrl) and the Kontakt line's own value
       (linking to contactUrl, when known) stay the same color as their
       surrounding text, including once visited, rather than taking on the
       page's general link color (.reveal a's own var(--khaki)) or a
       browser's default visited-link color: both would read as an unrelated
       accent color breaking up the heading/metadata's own single color,
       when the underlying text is already legible and the underline alone
       is enough to signal it is clickable. */
    .fort-text h3 a,
    .fort-text h3 a:visited,
    .fort-meta a,
    .fort-meta a:visited {
      color: inherit;
    }

    .fort-text h3 a:hover {
      color: var(--orange-60);
    }

    .fort-meta a:hover {
      color: var(--khaki-dark);
    }

    /* A specialized fortification term inline within a fort's own
       description/attraction text (see fortificationData's own comment on
       glossary markup): a <button>, not a <span> with a click handler, so
       it is keyboard-operable (Enter/Space) without a separate keydown
       handler, the same way every other interactive element on this page
       already is. Colored var(--khaki), the same color .reveal a already
       uses for every other link on this page (4.94:1 against the page's
       own dark background, clearing WCAG 2.2 AA's 4.5:1 normal-text
       minimum), not the page's own accent orange, which is reserved for
       headings and controls elsewhere. Dotted, not solid, underline still
       distinguishes it from a plain solid-underlined <a>. The previous
       var(--khaki-light) (a lighter, greyer tint) was too close to the
       surrounding white paragraph text to read as clickable, confirmed on
       both a real screenshot and a real mobile screen. */
    .glossary-term {
      display: inline;
      margin: 0;
      padding: 0;
      border: none;
      border-bottom: 2px dotted var(--khaki-lightest);
      background: none;
      color: var(--khaki-lightest);
      font: inherit;
      cursor: pointer;
    }

    .glossary-term:hover {
      border-bottom-color: var(--khaki-light);
      color: var(--khaki-light);
    }

    /* The term's own explanation text, hidden inline until openGlossaryPopup()
       copies it into #glossary-content below; never rendered in place. */
    .glossary-explanation {
      display: none;
    }

    .glossary-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .glossary-overlay.open {
      display: flex;
    }

    .glossary-backdrop {
      position: fixed;
      inset: 0;
      background-color: var(--black-60);
    }

    /* width is vw-primary, not vh: this presentation is landscape-only
       (portrait is blocked entirely by #portrait-warning), so a short
       viewport is always wide too, and a vh-tied width read as a
       tall/square card instead of a wide banner there. */
    .glossary-frame {
      position: relative;
      width: min(70vw, 500px);
      margin: 20px;
      padding: clamp(16px, calc(var(--real-vh, 1vh) * 5), 28px);
      background-color: var(--brown);
      border: 1px solid var(--khaki);
      border-radius: 8px;
      box-shadow: 0 8px 32px var(--black-40);
    }

    /* Straddles the frame's own top-right corner (half outside, half
       inside, via a negative offset of half its own size) rather than
       sitting fully inside it: fully inside needed matching top padding
       reserved on .glossary-content so text could never start on the same
       line as the button, which left an empty-looking gap above the first
       line on a short popup. Straddling the corner keeps the button clear
       of the text entirely without reserving any extra padding. clamp(),
       not a flat size: at the project's own shortest supported viewport
       (540x320) a flat 28px button read oversized next to the shrunk
       popup around it. */
    .glossary-close {
      position: absolute;
      top: calc(clamp(20px, calc(var(--real-vh, 1vh) * 6), 28px) / -2);
      right: calc(clamp(20px, calc(var(--real-vh, 1vh) * 6), 28px) / -2);
      width: clamp(20px, calc(var(--real-vh, 1vh) * 6), 28px);
      height: clamp(20px, calc(var(--real-vh, 1vh) * 6), 28px);
      border-radius: 50%;
      border: none;
      background-color: var(--khaki);
      color: var(--white);
      font-size: clamp(11px, calc(var(--real-vh, 1vh) * 3), 16px);
      cursor: pointer;
    }

    .glossary-close:hover {
      background-color: var(--khaki-dark);
    }

    .glossary-content {
      /* --real-vh, same reason as .glossary-frame above. Floor raised from
         an earlier 9pt, which read too small at the shortest viewport. */
      font-size: clamp(11pt, calc(var(--real-vh, 1vh) * 4), 16pt);
      line-height: 1.5;
      color: var(--white);
    }

    .glossary-content a {
      color: var(--khaki);
    }

    .glossary-content a:hover {
      color: var(--khaki-dark);
    }
  </style>
</head>

    function syncViewportHeight() {
      document.documentElement.style.height = window.innerHeight + 'px';

    /** Expands every {{displayText|key}} marker in a fort's own description or
     *  attraction text (see fortificationData's own comment on that syntax)
     *  into a full glossary-term button, so appendFortSlide() below never
     *  works with raw {{...}} text.
     * @param {string} text - a fort's own description or attraction string.
     * @returns {string} the same text with every marker replaced by
     *   <button class="glossary-term">...</button> markup. */
    function expandGlossaryMarkers(text) {
      return text.replace(/\{\{([^|}]+)\|([^}]+)\}\}/g, function(match, displayText, key) {
        const term = glossaryData[key];
        return '<button class="glossary-term" onclick="openGlossaryPopup(this)">' + displayText +
          '<span class="glossary-explanation" hidden>' + term.definition +
          ' <a href="' + term.wikipediaUrl + '" target="_blank" rel="noopener noreferrer">Wikipedia</a></span></button>';
      });
    }

    /** Opens the glossary popup for a clicked term button, copying that
     *  term's own explanation (rendered into the button by
     *  expandGlossaryMarkers() above, sourced from glossaryData) into the
     *  shared overlay. */
    function openGlossaryPopup(termButton) {
      const explanation = termButton.querySelector('.glossary-explanation');
      document.getElementById('glossary-content').innerHTML = explanation.innerHTML;
      document.getElementById('glossary-overlay').classList.add('open');
    }

    function closeGlossaryPopup() {
      document.getElementById('glossary-overlay').classList.remove('open');
    }

    document.getElementById('glossary-close').addEventListener('click', closeGlossaryPopup);
    document.getElementById('glossary-backdrop').addEventListener('click', closeGlossaryPopup);
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') closeGlossaryPopup();
    });
    // Navigating away from the slide (map or another fort) closes any open
    // popup rather than leaving it floating over unrelated content.
    Reveal.addEventListener('slidechanged', closeGlossaryPopup);

    /** Builds a Google Maps search URL for one fort's own coords, so Adres
     *  can link out to a pin the visitor can get walking or driving
     *  directions from, without this page choosing that travel mode itself.
     *  coords is [longitude, latitude] (see fortificationData's own comment
     *  on that field), reversed here because Google's own query parameter
     *  expects latitude,longitude. */
    function buildGoogleMapsUrl(coords) {
      const [longitude, latitude] = coords;
      return 'https://www.google.com/maps/search/?api=1&query=' + latitude + ',' + longitude;
    }

    /** Extracts the video ID from fort.video's own full YouTube watch URL, so
     *  that one field drives both the thumbnail image below and the link it
     *  opens, rather than storing the ID a second time in fortificationData. */
    function getYouTubeVideoId(videoUrl) {
      return new URL(videoUrl).searchParams.get('v');
    }

    /** Appends one <section class="fort-slide"> built from a fortificationData
     *  entry to .reveal .slides, reusing the same CSS classes the slides used
     *  when they were hand-written markup (see the CSS's own .fort-slide,
     *  .fort-content, .fort-image, .fort-text, .fort-description, .fort-meta,
     *  .fort-video-badge, and .fort-video-thumb rules). Must run before
     *  Reveal.initialize(), which scans the DOM once for its own slide list
     *  and does not pick up sections appended afterwards. */
    function appendFortSlide(fort) {
      // "Wymagany kontakt" rather than a plain "Tak" whenever a contact
      // field exists, so Zwiedzanie says so directly.
      const visitableClass = fort.visitable ? 'fort-visitable-yes' : 'fort-visitable-no';
      const visitableText = fort.visitable
        ? (fort.contact ? 'Wymagany kontakt' : 'Tak')
        : 'Nie';

      // fort.name/fort.contact stay the visible text either way; contactText only
      // differs in whether that text is wrapped in an <a>, so a fort with no
      // contactUrl still shows its contact string, just not as a link.
      const nameText = fort.nameUrl
        ? '<a href="' + fort.nameUrl + '" target="_blank" rel="noopener noreferrer">' + fort.name + '</a>'
        : fort.name;
      const contactText = fort.contact
        ? (fort.contactUrl
            ? '<a href="' + fort.contactUrl + '" target="_blank" rel="noopener noreferrer">' + fort.contact + '</a>'
            : fort.contact)
        : '';

      const addressText = '<a href="' + buildGoogleMapsUrl(fort.coords) + '" target="_blank" rel="noopener noreferrer">' + fort.address + '</a>';

      // Adres, Zwiedzanie, Kontakt (in that order): one plain column below
      // the photo, all three sharing its own full width. The video thumbnail
      // (see videoBadge below) is overlaid on the photo itself instead of
      // sitting beside these lines, so none of them need to make room for it
      // or align against it.
      const metaLines =
        '<p class="fort-meta"><strong>Adres:</strong> ' + addressText + '</p>' +
        '<p class="fort-meta"><strong>Zwiedzanie:</strong> <span class="' + visitableClass + '">' + visitableText + '</span></p>' +
        (fort.contact ? '<p class="fort-meta"><strong>Kontakt:</strong> ' + contactText + '</p>' : '');

      // A plain thumbnail <img>, not an iframe: an embedded player's own
      // initial "cued" state always draws a large play button centered over
      // the whole frame, which covered the presenter's face on this
      // project's own fort videos. The thumbnail carries no such overlay
      // (see .fort-video-thumb's own comment for the corner .play-badge used
      // instead), and the whole thing is one link, so no separate "watch on
      // YouTube" text link is needed alongside it. Overlaid on the fort
      // photo's own bottom-left corner (see .fort-video-badge's own comment
      // for why), diagonal from the Wikimedia credit badge above.
      const videoBadge = fort.video
        ? '<div class="fort-video-badge">' +
            '<p class="fort-video-label">YouTube</p>' +
            '<a class="fort-video-thumb" href="' + fort.video + '" target="_blank" rel="noopener noreferrer">' +
              '<img src="https://img.youtube.com/vi/' + getYouTubeVideoId(fort.video) + '/hqdefault.jpg" alt="Zobacz wideo: ' + fort.name + '">' +
              '<span class="play-badge" aria-hidden="true">▶</span>' +
            '</a>' +
          '</div>'
        : '';

      document.querySelector('.reveal .slides').insertAdjacentHTML('beforeend',
        '<section class="fort-slide">' +
          '<button class="return-button" onclick="Reveal.slide(0)">← Wróć do mapy</button>' +
          '<div class="fort-content">' +
            '<div class="fort-image">' +
              '<div class="fort-photo">' +
                '<img src="' + fort.image + '" alt="' + fort.name + '">' +
                '<p class="image-credit"><a href="' + fort.imageAttribution + '" target="_blank" rel="noopener noreferrer">Wikimedia</a></p>' +
                videoBadge +
              '</div>' +
              metaLines +
            '</div>' +
            '<div class="fort-text">' +
              '<h3>' + nameText + '</h3>' +
              '<p class="fort-description">' + expandGlossaryMarkers(fort.description + ' ' + fort.attraction) + '</p>' +
            '</div>' +
          '</div>' +
        '</section>'
      );
    }

    // #map-slide's own <h2> is static markup, so unlike fort.description and
    // fort.attraction above it never goes through expandGlossaryMarkers()
    // via appendFortSlide(); expand its {{...}} markers here instead.
    const mapSlideHeading = document.querySelector('#map-slide h2');
    mapSlideHeading.innerHTML = expandGlossaryMarkers(mapSlideHeading.innerHTML);

    // Slide 1 is the static #map-slide above; every fort slide from here on is
    // appended in fortificationData's own I-XV order, filtered to the forts
    // currently marked visible, so the slide count and each fort's own slide
    // index both track fortificationData directly rather than a separate
    // hardcoded count.
    fortificationData
      .filter(function(fort) { return fort.visible; })
      .forEach(appendFortSlide);

    Reveal.initialize({
      // Read from the CSS custom property rather than a second literal
      // copy of the same color, so --brown stays this page's own
      // single source of truth for that color.
      backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--brown').trim(),
      width: 1280,
      height: 720,
      margin: 0,
      controls: true,
      hash: true,
      transition: 'fade',
      center: false,
      // Reveal.js's own touch: true default binds a swipe detector independent
      // of the map's touchmove handling above, so dragging the map still reads
      // as a slide-navigation swipe and changes slides. Navigation is already
      // available via marker clicks, the return button, and the on-screen
      // controls, so disabling swipe entirely has no functional cost.
      touch: false
    });

    let mapInitialized = false;
    // Nudged south of the fort ring's geographic middle so markers XI-XIII
    // clear the attribution control below; further south clips marker V
    // under the title instead.
    const mapCenter = [18.63, 53.01];
    // Halfway between the previous default (12) and one zoom level out (11),
    // so the initial view sits between the two rather than matching either.
    const mapInitialZoom = 11.5;

    /** Moves .controls from its default position, a sibling of .slides, to
     *  a child of .slides, so its arrows pick up the same CSS scale
     *  transform as the fort title/return button (a transformed ancestor
     *  becomes the containing block for a fixed-position descendant),
     *  keeping their position and size in sync without duplicating Reveal's
     *  own transform math in a separate formula. */
    function moveControlsIntoSlides() {
      const controls = document.querySelector('.reveal .controls');
      const slides = document.querySelector('.reveal .slides');
      if (controls && slides) slides.appendChild(controls);
    }

    /** Sets --map-counter-zoom on #map to the reciprocal of Reveal's current
     *  CSS transform scale so that CSS zoom rules on MapLibre elements compensate
     *  for the Reveal.js scale and maintain their intended physical pixel sizes. */
    function updateMapCounterZoom() {
      const mapElement = document.getElementById('map');
      if (mapElement === null) return;
      const scale = Reveal.getScale ? Reveal.getScale() : 1;
      if (scale <= 0) return;
      mapElement.style.setProperty('--map-counter-zoom', (1 / scale).toFixed(4));
    }
    /** @type {maplibregl.Map|null} Retained so event handlers outside initializeMap can call resize(). */
    let libreMap = null;

    function initializeMap() {
      if (mapInitialized) return;

      // maplibre-gl loads as an ES module (see the <script type="module"> above), which
      // fetches and evaluates without blocking Reveal.initialize(); it can therefore
      // still be loading when this first runs. Wait for the module's own
      // 'maplibregl-ready' event rather than polling, then retry once, by which point
      // `maplibregl` is guaranteed defined.
      if (typeof maplibregl === 'undefined') {
        window.addEventListener('maplibregl-ready', initializeMap, { once: true });
        return;
      }

      mapInitialized = true;

      const mapElement = document.getElementById('map');

      if (!mapElement) {
        console.error('Map element not found');
        return;
      }
      updateMapCounterZoom();

      const map = new maplibregl.Map({
        container: 'map',
        // OpenFreeMap (openfreemap.org) is a free, MIT-licensed vector tile
        // service with no API key, no mandatory branding, and no usage cap.
        // "liberty" keeps OpenFreeMap's classic OSM-style colors (unlike the
        // grayscale "positron" style), matching the site owner's request for
        // Leaflet-default-like colors; the layers hidden below are unrelated
        // to this style choice (see the map.on('load', ...) comment below).
        style: 'https://tiles.openfreemap.org/styles/liberty',
        center: mapCenter,
        zoom: mapInitialZoom,
        minZoom: 11,
        // The openmaptiles vector source's own maxzoom is 14 (confirmed via its
        // TileJSON); maxZoom past that is overzoom, MapLibre magnifying the same
        // zoom-14 tile rather than fetching more detail. One overzoom level (15)
        // still renders cleanly; a second (16) doubles that magnification again
        // and made symbol/label placement behave inconsistently on review.
        maxZoom: 15,
        attributionControl: false
      });

      libreMap = map;

      // Hide vector tile layers not useful for locating a fortification: the
      // underlying vector tiles carry every layer regardless of which ones
      // are painted, so this reduces rendering work (paint/label-collision
      // cost, most notably the 3D building extrusions), not network bytes.
      // Roads (incl. street names, since a fort sits on an ordinary street
      // a visitor needs to recognize), water, and city-level place labels
      // stay visible for orientation; everything else here is either
      // decorative clutter or irrelevant to reaching a fort by road. This
      // list is longer than a comparable positron-style list would be
      // (see README.md's MapLibre GL JS map setup section) because the
      // "liberty" style itself defines roughly twice as many layers, which
      // is also what gives it Leaflet-default-like colors instead of
      // positron's grayscale minimalism.
      map.on('load', function() {
        const hiddenLayers = [
          // building-3d (fill-extrusion) is hidden while its own real-device
          // performance impact is being checked; plain 'building' footprints stay
          // visible, only the extra extrusion/shading cost is removed here.
          'building-3d',
          'boundary_3', 'boundary_2', 'boundary_disputed',
          'landuse_pitch', 'landuse_track', 'landuse_cemetery', 'landuse_hospital', 'landuse_school',
          'road_area_pattern', 'road_one_way_arrow', 'road_one_way_arrow_opposite',
          // poi_r1 (rank 1-6) is deliberately kept visible, not hidden here: each
          // fort itself is tagged in OpenStreetMap as a rank-1 tourism attraction
          // POI, so this is what shows the fort's own name on the map. poi_transit
          // (airport/bus/rail transit points, including railway stations) is also
          // kept visible. Only poi_r7/poi_r20 (lower-ranked generic POIs: shops,
          // amenities, etc.) stay hidden as unrelated clutter.
          'poi_r20', 'poi_r7',
          'waterway_line_label',
          'highway-name-path',
          // label_village/label_town/label_country_* stay hidden (still too
          // granular/irrelevant at this map's scale); label_other, railways, and
          // the route-number shields were re-enabled after review to make the
          // default view read as a fuller map instead of a stripped-down one:
          // label_other carries district/neighbourhood names (everything except
          // city/town/village/state/country, which have their own layers).
          'label_village', 'label_town',
          'label_country_3', 'label_country_2', 'label_country_1'
        ];
        hiddenLayers.forEach(function(layerId) {
          map.setLayoutProperty(layerId, 'visibility', 'none');
        });

        // Temporary test: the style's own 'building' fill (hsl(35,8%,85%)) is close
        // enough to the background/land color to be practically invisible now that
        // building-3d above is hidden. Darkened here only to judge whether visible
        // 2D building footprints are worth keeping at all, given this map's actual
        // purpose (locating a fort), not a decision yet.
        map.setPaintProperty('building', 'fill-color', 'hsl(35,20%,72%)');

        // The style itself caps 'building' at maxzoom 14, hand-off to building-3d
        // (minzoom 14) above that; with building-3d hidden, that hand-off left a
        // gap where no buildings render at all past zoom 14. Overriding building's
        // own zoom range keeps it rendering at every zoom instead, while this is
        // still being evaluated.
        map.setLayerZoomRange('building', 13, 24);
      });

      // Move attribution to bottom-left so it does not collide with any
      // reveal.js navigation element that may appear at bottom-right.
      // MapLibre GL JS does not add its own branding prefix to the attribution
      // control, unlike some other map libraries, so no prefix removal step is
      // needed: the default control is disabled above and this custom one added
      // instead, with customAttribution for the extra forteczneforum.pl and
      // marcindulak credits, plus a GDPR legal-basis line (see README's
      // Attribution section for the rationale). customAttribution always
      // joins before the style's own required attribution with no way to
      // place content after it, so the legal-basis line goes first,
      // followed by <br>, landing alone on the line above the rest.
      map.addControl(new maplibregl.AttributionControl({
        compact: false,
        customAttribution: 'OpenFreeMap przetwarza adres IP by wyświetlić mapę (uzasadniony interes)<br>&copy; <a href="https://forteczneforum.pl/">forteczneforum.pl</a> | &copy; <a href="https://marcindulak.github.io">marcindulak</a>'
      }), 'bottom-left');
      map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-left');

      // This is a static navigation map, not a 3D scene, so touch rotate and
      // pitch add no value; left enabled, an imprecise two-finger touch that
      // mixes zoom with rotation or tilt reads as an unintentional wiggle
      // rather than a deliberate gesture. Pinch-to-zoom itself stays enabled;
      // only the rotate and pitch portions of the combined touch handlers are
      // turned off.
      map.touchZoomRotate.disableRotation();
      map.touchPitch.disable();

      // Derived from fortificationData rather than a separate hardcoded list:
      // slide indices start at 1 (slide 0 is the static #map-slide) and follow
      // the same filtered I-XV order appendFortSlide() used to append each
      // fort's own slide above, so a marker always points at the right slide
      // regardless of how many forts are currently marked visible.
      const locations = fortificationData
        .filter(function(fort) { return fort.visible; })
        .map(function(fort, index) {
          return { number: fort.number, coords: fort.coords, slide: index + 1 };
        });

      // 0.001 degrees latitude is ~111 meters; see its use in addMarkers() below
      // for why the marker box needs shifting away from each fort's coordinate.
      const MARKER_LATITUDE_OFFSET_DEGREES = 0.001;

      // Marker elements are recreated on resize with their size proportional to
      // 1/Reveal.getScale() so their physical tap area stays ~44 px regardless
      // of the Reveal transform scale.
      let markerInstances = [];

      function createLetterElement(number, scale) {
        const size = Math.round(33 / scale);
        const fontPx = Math.round(12 / scale);
        const element = document.createElement('div');
        element.className = 'fort-letter-box';
        element.style.width = size + 'px';
        element.style.height = size + 'px';
        element.style.fontSize = fontPx + 'px';
        element.textContent = number;
        return element;
      }

      function addMarkers() {
        markerInstances.forEach(function(m) { m.remove(); });
        markerInstances = [];
        const scale = Reveal.getScale ? Reveal.getScale() : 1;
        locations.forEach(function(location) {
          const element = createLetterElement(location.number, scale);
          element.addEventListener('click', function() {
            Reveal.slide(location.slide);
          });
          // Shifted north by a real-world distance, not a screen-pixel offset, so
          // the box stays a consistent distance from each fort's own footprint at
          // every zoom level and viewport size, clear of the OpenFreeMap POI label
          // MapLibre renders at the fort's own coordinate (extending downward from
          // it) once zoomed in enough to appear. location.coords itself is left
          // untouched, since it is also used to link out to Google Maps.
          const markerCoords = [location.coords[0], location.coords[1] + MARKER_LATITUDE_OFFSET_DEGREES];
          const marker = new maplibregl.Marker({ element: element })
            .setLngLat(markerCoords)
            .addTo(map);
          markerInstances.push(marker);
        });
      }

      addMarkers();

      // Orientation change or browser resize (e.g. mobile URL bar appearing/
      // disappearing) causes MapLibre to lose track of its container dimensions.
      // resize() forces MapLibre to recalculate and repaint tiles.
      //
      // On the DuckDuckGo Android browser (see its own toolbar-sliding quirk
      // above), touching the map fires a burst of several `resize` events
      // that all report the exact same window.innerWidth/innerHeight
      // (confirmed on-device: scrollY stayed 0 throughout). Resetting the
      // map's center/zoom on every one of those no-op events wiped out a
      // user's pinch-zoom almost as soon as they made it. Comparing against
      // the size seen at the last genuine reset skips the no-op events.
      let lastMapResetWidth = null;
      let lastMapResetHeight = null;
      window.addEventListener('resize', function() {
        if (!libreMap) return;
        const currentSlide = Reveal.getCurrentSlide();
        if (!currentSlide || currentSlide.id !== 'map-slide') return;
        if (window.innerWidth === lastMapResetWidth && window.innerHeight === lastMapResetHeight) return;
        lastMapResetWidth = window.innerWidth;
        lastMapResetHeight = window.innerHeight;
        updateMapCounterZoom();
        libreMap.resize();
        libreMap.jumpTo({ center: mapCenter, zoom: mapInitialZoom });
        addMarkers();
      });
    }

    Reveal.addEventListener('slidechanged', function(event) {
      if (event.currentSlide && event.currentSlide.id === 'map-slide') {
        initializeMap();
        if (libreMap) {
          // Recalculate the map container size after the slide transition, then
          // reset to the original view without animation so the pan is not visible.
          libreMap.resize();
          libreMap.jumpTo({ center: mapCenter, zoom: mapInitialZoom });
        }
      }
    });

    Reveal.addEventListener('ready', function() {
      moveControlsIntoSlides();
      const currentSlide = Reveal.getCurrentSlide();
      if (currentSlide && currentSlide.id === 'map-slide') {
        initializeMap();
      }
      // Try to lock to landscape; silently fails on iOS and on Android outside
      // fullscreen/PWA context, which is the expected result for a normal page.
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(function(error) {
          console.log('Cannot lock orientation to landscape:', error);
        });
      }
    });
  </script>
</body>
</html>
